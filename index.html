<style>
body{
  font-family: Arial;
  max-width: 800px;

  display:block;

  background:#333;

  margin:10px auto;

  margin-top:10px;

<body>
<div style="text-align:center; margin-bottom:20px;">
<a href="index.html">Home</a> |

<button onclick="toggleDarkMode()">🌙 Dark Mode</button>

<h1>🔥 Tools Hub V3</h1>

<!-- WORD COUNTER -->
<div class="card">
<h2>Word Counter</h2>

<textarea id="text" placeholder="Type here..."></textarea>

<p>Words: <span id="words">0</span></p>
<p>Characters: <span id="chars">0</span></p>
<p>Characters (with spaces): <span id="chars2">0</span></p>
<p>Sentences: <span id="sentences">0</span></p>
<p>Reading Time: <span id="reading">0</span> min</p>

<button onclick="toUpper()">UPPERCASE</button>
<button onclick="toLower()">lowercase</button>
<button onclick="copyText()">Copy Text</button>
<button onclick="removeSpaces()">Remove Extra Spaces</button>
</div>

<!-- QR -->
<div class="card">
<h2>QR Generator</h2>

<input id="qrtext" placeholder="Enter text or URL">

<button onclick="generateQR()">Generate QR</button>
<button onclick="downloadQR()">Download QR</button>

<canvas id="qrcode"></canvas>
</div>

<!-- PASSWORD -->
<div class="card">
<h2>Password Generator</h2>

<button onclick="generatePassword()">Generate Password</button>
<p id="pass"></p>
</div>

<!-- BARCODE GENERATOR -->
<div class="card">
<h2>Barcode Generator</h2>

<input id="barcodeText" placeholder="Enter text or number for barcode">

<button onclick="generateBarcode()">Generate Barcode</button>
<button onclick="downloadBarcode()">Download Barcode</button>

<svg id="barcode"></svg>
</div>

<!-- AGE CALCULATOR -->
<div class="card">
<h2>Age Calculator</h2>

<label>Date of Birth:</label>
<input type="date" id="dob">

<button onclick="calculateAge()">Calculate Age</button>

<div id="ageResult"></div>
</div>

<script>

document.getElementById("text").addEventListener("input", function(){

let t = this.value.trim();
let words = t ? t.split(/\s+/).length : 0;

document.getElementById("words").innerText = words;
document.getElementById("chars").innerText = this.value.replace(/\s/g,'').length;
document.getElementById("chars2").innerText = this.value.length;
document.getElementById("sentences").innerText = t ? t.split(/[.!?]+/).filter(Boolean).length : 0;
document.getElementById("reading").innerText = Math.max(1, Math.ceil(words/200));

});

// TEXT TOOLS
function toUpper(){
let t=document.getElementById("text");
t.value=t.value.toUpperCase();
}

function toLower(){
let t=document.getElementById("text");
t.value=t.value.toLowerCase();
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("text").value);
alert("Copied!");
}

function removeSpaces(){
let t=document.getElementById("text");
t.value=t.value.replace(/\s+/g,' ').trim();
}

// QR
function generateQR(){
QRCode.toCanvas(document.getElementById("qrcode"),
document.getElementById("qrtext").value);
}

function downloadQR(){
let canvas=document.getElementById("qrcode");
let a=document.createElement("a");
a.href=canvas.toDataURL("image/png");
a.download="qr.png";
a.click();
}

// PASSWORD
function generatePassword(){
let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!";
let pass="";
for(let i=0;i<10;i++){
pass += chars.charAt(Math.floor(Math.random()*chars.length));
}
document.getElementById("pass").innerText=pass;
}

// DARK MODE
function toggleDarkMode(){
document.body.classList.toggle("dark");
}

// BARCODE
function generateBarcode(){
let val = document.getElementById("barcodeText").value;
if(!val){
  alert("Please enter text or number!");
  return;
}
try {
  JsBarcode("#barcode", val, {
    format: "CODE128",
    lineColor: "#000",
    width: 2,
    height: 80,
    displayValue: true
  });
} catch(e) {
  alert("Invalid input for barcode!");
}
}

function downloadBarcode(){
let svg = document.getElementById("barcode");
let svgData = new XMLSerializer().serializeToString(svg);
let canvas = document.createElement("canvas");
let ctx = canvas.getContext("2d");
let img = new Image();
let svgBlob = new Blob([svgData], {type:"image/svg+xml;charset=utf-8"});
let url = URL.createObjectURL(svgBlob);
img.onload = function(){
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);
  URL.revokeObjectURL(url);
  let a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "barcode.png";
  a.click();
};
img.src = url;
}

// AGE CALCULATOR
function calculateAge(){
let dob = document.getElementById("dob").value;
if(!dob){
  alert("Please select your date of birth!");
  return;
}
let birthDate = new Date(dob);
let today = new Date();

let years = today.getFullYear() - birthDate.getFullYear();
let months = today.getMonth() - birthDate.getMonth();
let days = today.getDate() - birthDate.getDate();

if(days < 0){
  months--;
  let prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
  days += prevMonth.getDate();
}
if(months < 0){
  years--;
  months += 12;
}

let totalDays = Math.floor((today - birthDate) / (1000*60*60*24));
let totalWeeks = Math.floor(totalDays / 7);
let totalMonths = years * 12 + months;
let nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
if(nextBirthday <= today) nextBirthday.setFullYear(today.getFullYear() + 1);
let daysToNext = Math.ceil((nextBirthday - today) / (1000*60*60*24));

document.getElementById("ageResult").innerHTML =
  "<p>🎂 <b>Age:</b> " + years + " Years, " + months + " Months, " + days + " Days</p>" +
  "<p>📅 <b>Total Days Lived:</b> " + totalDays.toLocaleString() + " days</p>" +
  "<p>📆 <b>Total Weeks:</b> " + totalWeeks.toLocaleString() + " weeks</p>" +
  "<p>🗓️ <b>Total Months:</b> " + totalMonths + " months</p>" +
  "<p>🎉 <b>Next Birthday In:</b> " + daysToNext + " days</p>";
}

</script>

</body>
